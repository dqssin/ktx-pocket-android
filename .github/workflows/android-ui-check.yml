name: Android screen checks
on:
  push:
    paths: ['app/**', '.github/workflows/android-ui-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare disposable emulator build
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          source = path.read_text().replace("abiFilters 'arm64-v8a'", "abiFilters 'x86_64'")
          # Screen-only build: Python dependencies are never executed here.
          # Keep this disposable APK out of artifacts and releases.
          path.write_text('\n'.join(line for line in source.splitlines() if not line.lstrip().startswith("install '")) + '\n')
          path = Path('app/src/main/java/kr/personal/ktxpocket/MainActivity.java')
          source = path.read_text()
          flag = 'getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);'
          assert source.count(flag) == 1
          # Only this disposable CI checkout permits screenshots. No credentials
          # are entered; the shipped ARM64 APK keeps FLAG_SECURE enabled.
          path.write_text(source.replace(flag, ''))
          PY
          chmod +x gradlew
      - name: Build emulator APK
        run: ./gradlew --no-daemon :app:assembleDebug -PbuildPython="$(which python)"
      - name: Prepare Android emulator
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --name screen --package 'system-images;android-35;google_apis;x86_64' --device pixel_5 --force
          "$ANDROID_HOME/emulator/emulator" -avd screen -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Capture default and large text screens
        run: |
          mkdir -p screen-check
          python - <<'PY'
          import re, subprocess, time
          from pathlib import Path
          import xml.etree.ElementTree as ET
          package = 'kr.personal.ktxpocket'
          def adb(*args):
              return subprocess.check_output(['adb', *args])
          def capture(name):
              # No login, query or reservation is attempted in this workflow.
              time.sleep(1)
              adb('shell', 'uiautomator', 'dump', '/sdcard/window.xml')
              xml = adb('shell', 'cat', '/sdcard/window.xml')
              Path('screen-check/' + name + '.xml').write_bytes(xml)
              Path('screen-check/' + name + '.png').write_bytes(adb('exec-out', 'screencap', '-p'))
              return ET.fromstring(xml)
          def launch():
              adb('shell', 'am', 'force-stop', package)
              adb('shell', 'am', 'start', '-W', '-n', package + '/.MainActivity')
          launch()
          tree = capture('default')
          assert any(n.get('text') == '검색 시작' for n in tree.iter('node')), 'Missing start control'
          # Collapse the route section by its actual accessible bounds.
          header = next(n for n in tree.iter('node') if n.get('text') == '예약 조건' and n.get('clickable') == 'true')
          x1, y1, x2, y2 = map(int, re.findall(r'\d+', header.get('bounds')))
          adb('shell', 'input', 'tap', str((x1+x2)//2), str((y1+y2)//2))
          capture('sections')
          adb('shell', 'settings', 'put', 'system', 'font_scale', '1.3')
          launch()
          tree = capture('large-text')
          assert any(n.get('text') == '검색 시작' for n in tree.iter('node')), 'Start control missing at large font size'
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screen-check
          path: |
            screen-check/
            emulator.log
          retention-days: 7
