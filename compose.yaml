name: ktx-pocket
services:
  web:
    build: .
    image: ktx-pocket-web:local
    ports:
      - "127.0.0.1:${KTX_WEB_PORT:-8765}:8080"
    volumes:
      - ktx-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ktx-data:
